version: '3'

services:

  postgres:
    image: postgres:15

    environment:
      POSTGRES_DB: tool_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

  backend:
    build: ./backend

    ports:
      - "8080:8080"

    depends_on:
      - postgres

  frontend:
    build: ./frontend

    ports:
      - "5173:5173"

    depends_on:
      - backend